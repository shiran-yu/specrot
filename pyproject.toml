[project]
name = "specrot"
version = "0.1.0"
description = "Find the dead RFCs your code still cites: every IETF RFC and how they relate, as a Relate graph."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "mcp>=2,<3",
    "relate-db>=1.3.0",
    "rich>=13",
]

[project.scripts]
specrot = "specrot.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["specrot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
